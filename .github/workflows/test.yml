name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked mypy
      - run: uv run --locked python -m unittest -v
      - run: uv run --locked python -m py_compile bridge.py
      - run: uv run --locked bridge.py --help
